name: Deploy Healthcare ML API

permissions:
  id-token: write
  contents: read

on:
  workflow_run:
    workflows: ["01 - Lint Code with Ruff"]   # must match the exact name
    types:
      - completed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Generate sample data
      run: |
        python src/sample_data/generate_sample_data.py
    
    - name: Run tests
      run: |
        # Simple test to ensure the model can be imported and instantiated
        python -c "from src.model import DiabetesPredictor; predictor = DiabetesPredictor(); print('Model import successful')"

  deploy-develop:
    # if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: test
    environment: development
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ vars.AWS_REGION }}
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
        role-session-name: GitHubActions-${{ github.run_id }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: mlops/healthcare-ml-app-dev
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Update Security Group with GitHub IPs
      run: |
        # Get GitHub Actions IP ranges
        IPS=$(curl -s https://api.github.com/meta | jq -r '.actions[] | select(. != null)')
        
        # Update security group (pseudo-code)
        for ip in $IPS; do
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr $ip
        done

    - name: Check and start EC2 instance if stopped
      run: |
        # Get instance status
        INSTANCE_STATE=$(aws ec2 describe-instances \
          --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
          --query 'Reservations[0].Instances[0].State.Name' \
          --output text)
        
        echo "Instance state: $INSTANCE_STATE"
        
        # Start instance if stopped
        if [ "$INSTANCE_STATE" = "stopped" ]; then
          echo "Starting instance..."
          aws ec2 start-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
          
          # Wait for instance to be running
          echo "Waiting for instance to start..."
          aws ec2 wait instance-running \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
        fi

        # Get public IP (in case it changed after start)
        export PUBLIC_IP=$(aws ec2 describe-instances \
          --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
          --query 'Reservations[0].Instances[0].PublicIpAddress' \
          --output text)
        
        echo "Public IP: $PUBLIC_IP"
        echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

    - name: SSH to EC2 and deploy
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ env.PUBLIC_IP }}  # Use the updated IP
        username: ${{ vars.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Pull and run the new container
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          docker pull ${{ steps.build.outputs.image }}
          docker stop healthcare-ml-app || true
          docker rm healthcare-ml-app || true
          docker run -d -p 8000:8000 --name healthcare-ml-app ${{ steps.build.outputs.image }}

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    environment: production
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-region: ${{ vars.AWS_REGION }}
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: healthcare-ml-app-prod
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_PROD_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Pull and run the new container
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          docker pull ${{ steps.build.outputs.image }}
          docker stop healthcare-ml-app || true
          docker rm healthcare-ml-app || true
          docker run -d -p 8000:8000 --name healthcare-ml-app ${{ steps.build.outputs.image }}