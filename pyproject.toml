[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-ml-pipeline"
version = "0.1.0"
description = "Healthcare ML prediction API (FastAPI)"
authors = [
    { name="Marco Russo", email="you@example.com" }
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "pandas>=2.0",
    "numpy>=1.25",
    "scikit-learn>=1.3",
    "uvicorn[standard]>=0.23"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "requests>=2.32",
    "ruff>=0.0.295"
]

[tool.ruff]
line-length = 88
select = ["E", "F", "W"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--verbose --maxfail=1 --tb=short"
testpaths = [
    "tests"
]
python_files = [
    "test_*.py"
]
