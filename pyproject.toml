[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
select = ["E", "F", "W"]  # Example rule selection
ignore = []               # Rules to ignore

[project]
name = "your-project"
requires-python = ">=3.8"
dependencies = []  # Your project dependencies

[project.optional-dependencies]
linter = ["ruff"]  # Ruff as an optional dependency
